<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connection Test - Manchester School of Modelling</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f4f7;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 2.5rem 3rem;
      text-align: center;
      max-width: 480px;
    }
    h1 {
      margin-top: 0;
      color: #1a1a2e;
    }
    .status {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      background: #e6f7ec;
      color: #1c7c3f;
      font-weight: 600;
    }
    #timestamp {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Manchester School of Modelling</h1>
    <p>This is a test page to confirm the repository is connected and serving content correctly.</p>
    <span class="status">&#9989; Connection Successful</span>
    <p id="timestamp"></p>
  </div>

  <script>
    document.getElementById('timestamp').textContent =
      'Page loaded at: ' + new Date().toLocaleString();
  </script>
</body>
</html>
